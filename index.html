<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Андрей — мост букв</title><style>*{box-sizing:border-box}body{margin:0;background:#152c38;color:#233d56;font:700 18px system-ui}main{max-width:980px;margin:auto;min-height:100vh;padding:16px;background:linear-gradient(#85cfe9,#d7f7ee 68%,#75bf8a 68%)}h1{text-align:center;margin:5px;font-size:clamp(25px,5vw,43px)}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#fff9;border:2px solid #fff;border-radius:30px;padding:7px 14px}.world{position:relative;max-width:900px;height:clamp(250px,43vw,400px);margin:14px auto;background:linear-gradient(#8bd4ee 0 60%,#8fce95 60%);border:5px solid white;border-radius:26px;overflow:hidden;box-shadow:0 10px 20px #3455}.tree{position:absolute;bottom:24%;font-size:clamp(80px,13vw,140px)}.tree.a{left:0}.tree.b{right:0}.river{position:absolute;bottom:0;left:16%;width:68%;height:40%;background:repeating-linear-gradient(170deg,#328fc9 0 20px,#55b9de 20px 38px);border-radius:50% 50% 0 0;animation:water 3s linear infinite}.bank{position:absolute;bottom:0;height:43%;width:19%;background:#72ba78}.bank.left{left:0;border-radius:0 45% 0 0}.bank.right{right:0;border-radius:45% 0 0 0}.bridge{position:absolute;bottom:30%;left:18%;width:64%;height:18%;display:flex;align-items:center;gap:3px}.plank{flex:1;height:64%;background:linear-gradient(#edc17d,#a56d3f);border:3px solid #724b2b;border-radius:5px;box-shadow:0 6px #614a37}.plank.future{background:#ffffff55;border:2px dashed #fff9;box-shadow:none}.plank.current{background:#f8db9d}.plank.fail{animation:break .7s forwards}.hero{position:absolute;left:9%;bottom:42%;width:44px;height:88px;z-index:5;transition:left .5s linear,bottom .5s linear,transform .5s;transform-origin:center bottom}.hero svg{width:100%;height:100%;filter:drop-shadow(2px 3px 1px #2645)}.hero.jump{animation:jump .7s ease-in-out forwards}.hero.die{animation:die 1.1s ease-in forwards}.hero.win{transform:translateY(-12px) rotate(-8deg)}.speech{position:absolute;top:5%;left:50%;transform:translateX(-50%);background:#fffce8;border:3px solid #fff;padding:8px 15px;border-radius:20px;text-align:center;max-width:85%;font-size:clamp(14px,2vw,20px)}.splash{position:absolute;left:50%;bottom:5%;font-size:60px;display:none}.splash.show{display:block;animation:pop .8s forwards}.panel{max-width:800px;margin:auto;background:#fffdf7;border:5px solid #fff;border-radius:26px;padding:15px;box-shadow:0 8px #478b6c;text-align:center}h2{margin:0 0 10px}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px}.choice{font:900 clamp(30px,5vw,48px) system-ui;color:#314d73;background:linear-gradient(#fff,#deebff);border:3px solid #9cbce5;box-shadow:0 6px #8aa9cc;border-radius:20px;min-width:90px;min-height:85px;cursor:pointer}.choice:disabled{opacity:.6}.btn{border:0;background:#ffd26d;border-radius:16px;padding:12px 18px;box-shadow:0 5px #d49a43;font:800 17px system-ui;cursor:pointer;margin:5px}.btn.alt{background:#dbeaff;box-shadow:0 5px #aac4e0}.message{min-height:30px;font-size:20px}.progress{display:flex;justify-content:center;gap:6px;margin:9px}.progress span{height:12px;flex:1;max-width:75px;background:#d5e3ed;border-radius:10px}.progress span.done{background:#75ce93}.progress span.now{background:#f8c962}.slots{min-height:56px}.slot{display:inline-block;border:2px dashed #7ca5c9;border-radius:12px;padding:6px 14px;margin:5px;font-size:25px}@keyframes jump{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-90px) rotate(-9deg)}100%{transform:translateY(0) rotate(0)}}@keyframes die{0%{transform:translateY(0) rotate(0);opacity:1}30%{transform:translateY(-35px) rotate(25deg)}100%{transform:translateY(145px) rotate(135deg);opacity:0}}@keyframes break{100%{transform:rotate(55deg) translateY(80px);opacity:0}}@keyframes pop{0%{transform:scale(.3);opacity:0}50%{opacity:1}100%{transform:scale(1.5);opacity:0}}@keyframes water{50%{background-position:50px 0}}@media(max-width:600px){main{padding:7px}.panel{padding:10px}.choice{min-width:75px;min-height:70px}.hero{width:30px;height:60px}.world{margin:9px auto}.speech{font-size:13px}}</style><main><div class="hud"><span class="pill">❤️ Жизни: 1</span><span class="pill">⭐ Победы: <span id="wins">0</span></span><button class="btn alt" id="sound">🔈 Звук: вкл.</button></div><h1>🌉 Андрей и мост букв</h1><div class="world"><div class="river"></div><div class="bank left"></div><div class="bank right"></div><div class="tree a">🌳</div><div class="tree b">🌲</div><div class="bridge" id="bridge"></div><div class="hero" id="hero"><svg viewBox="0 0 60 120"><path d="M17 77L14 108L26 109L31 87L36 109L48 108L44 77" fill="#3561b6"/><path d="M13 105H28V115H8Q7 110 13 105M35 105H50L56 115H34Z" fill="#333e50"/><path d="M14 47Q30 39 46 47L49 82H11Z" fill="#f1a84c"/><path d="M14 54L5 81M46 54L56 81" stroke="#f1a84c" stroke-width="11" stroke-linecap="round"/><circle cx="5" cy="83" r="6" fill="#f2b98c"/><circle cx="55" cy="83" r="6" fill="#f2b98c"/><rect x="25" y="37" width="12" height="12" rx="4" fill="#f2b98c"/><ellipse cx="31" cy="24" rx="22" ry="24" fill="#f3bd92"/><path d="M9 26Q1 1 29 0Q57 -2 54 26L47 17Q30 21 12 16Z" fill="#62412e"/><circle cx="23" cy="27" r="2.5" fill="#273447"/><circle cx="40" cy="27" r="2.5" fill="#273447"/><path d="M25 37Q31 42 37 37" stroke="#b75c58" stroke-width="2.5" fill="none"/></svg></div><div class="speech" id="speech">Помоги Андрею перейти мост!</div><div class="splash" id="splash">💦</div></div><div class="panel"><h2 id="heading">Выбери правильную букву!</h2><div class="progress" id="progress"></div><div id="question"></div><div class="slots" id="slots"></div><div class="choices" id="choices"></div><div class="message" id="message"></div><div id="actions"></div></div></main><script>
const levels=[{name:'Буквы',items:[['М','Н','М','Л'],['А','О','У','А'],['С','С','З','Ш'],['О','У','О','А'],['Л','Н','М','Л'],['Р','Р','П','В']]},{name:'Слоги',items:[['МА','МО','МА','МУ'],['СО','СА','СУ','СО'],['ЛУ','ЛА','ЛУ','ЛО'],['РА','РО','РУ','РА'],['КО','КО','КА','КУ'],['МИ','МА','МИ','МО']]},{name:'Слова',items:[['КОТ','КОТ','ДОМ','СОК'],['ДОМ','КОТ','СОН','ДОМ'],['ЛИСА','ЛУНА','ЛИСА','КОСА'],['СОК','СОК','СОН','КОТ'],['ЛУНА','ЛИСА','ЛУНА','ЛУЖА'],['МЯЧ','ЧАЙ','МЯЧ','МАК']]}];const $=s=>document.getElementById(s);let level=0,step=0,busy=false,muted=false,wins=Number(localStorage.getItem('andrey-bridge-wins')||0),ctx;$('wins').textContent=wins;function tone(f,d=.16){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type='triangle';o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d)}catch(e){}}function button(label,cb){let b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=cb;$('actions').append(b)}function build(){let el=$('bridge');el.innerHTML='';for(let i=0;i<6;i++){let p=document.createElement('div');p.className='plank '+(i<step?'':i===step?'current':'future');p.id='plank'+i;el.append(p)}$('progress').innerHTML='';for(let i=0;i<6;i++){let x=document.createElement('span');x.className=i<step?'done':i===step?'now':'';$('progress').append(x)}}function show(){busy=false;$('hero').className='hero';$('hero').style.left=(9+step*10.4)+'%';$('hero').style.bottom='42%';$('splash').classList.remove('show');$('actions').innerHTML='';$('choices').innerHTML='';$('message').textContent='';$('slots').innerHTML='';build();let a=levels[level].items[step];$('heading').textContent='Уровень '+(level+1)+' — '+levels[level].name;$('question').textContent=level===0?'Найди букву: '+a[0]:level===1?'Найди слог: '+a[0]:'Прочитай слово: '+a[0];$('speech').textContent='Правильный ответ — Андрей прыгнет на доску. Ошибка — доска сломается!';[1,2,3].map(i=>({v:a[i],r:Math.random()})).sort((a,b)=>a.r-b.r).forEach(({v})=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>choose(v,b);$('choices').append(b)});button('🔊 Произнести',()=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(a[0]);u.lang='ru-RU';u.rate=.78;speechSynthesis.speak(u)})}function choose(v,b){if(busy)return;busy=true;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(v===levels[level].items[step][0]){b.style.background='#c7f3cb';$('speech').textContent='Отлично! Андрей прыгает!';$('message').textContent='✅ Правильно!';tone(550);setTimeout(()=>tone(760),140);$('hero').classList.add('jump');$('hero').style.left=(19.4+step*10.4)+'%';setTimeout(()=>{step++;if(step===6)finish();else show()},950)}else{b.style.background='#ffb7bd';$('speech').textContent='Ой! Доска сломалась! Андрей упал в воду!';$('message').textContent='💦 Не получилось! Начинаем весь путь сначала.';tone(180,.45);$('plank'+step).classList.add('fail');$('hero').classList.add('die');setTimeout(()=>$('splash').classList.add('show'),650);$('actions').innerHTML='';setTimeout(()=>{button('↻ Начать с самого начала',()=>{level=0;step=0;show()})},1100)}}function finish(){$('hero').className='hero win';$('hero').style.left='87%';$('choices').innerHTML='';$('actions').innerHTML='';$('speech').textContent='Ура! Андрей перебрался через реку!';$('message').textContent='🏆 Мост пройден без ошибок!';$('question').textContent='';tone(740);setTimeout(()=>tone(920),180);if(level<2){button('Следующий мост ➜',()=>{level++;step=0;show()})}else{wins++;localStorage.setItem('andrey-bridge-wins',wins);$('wins').textContent=wins;button('Играть заново ↻',()=>{level=0;step=0;show()})}}$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Звук: выкл.':'🔈 Звук: вкл.'};show();
</script>
